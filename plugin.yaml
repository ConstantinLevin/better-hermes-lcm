name: hermes-lcm
# fork: better-hermeslcm — this line used to be byte-identical to upstream's, so nothing in a
# running install said which of the two was loaded. The fork carries its own version from here
# on; upstream's line is 1.0.0-rc.1 and the fork branches after it.
version: 1.1.0-beta.1
description: "Lossless Context Management — standalone Hermes plugin with a DAG-based context engine that never loses a message (better-hermeslcm fork)"
author: "Voltropy / Hermes Community"
provides_tools:
  - lcm_grep
  - lcm_recall
  - lcm_query_state
  - lcm_compute
  - lcm_compile_evidence
  - lcm_evidence_pack
  - lcm_retrieve
  - lcm_recent
  - lcm_load_session
  - lcm_describe
  - lcm_expand
  - lcm_expand_query
  - lcm_status
  - lcm_inspect
  - lcm_doctor
